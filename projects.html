  (function () {
    "use strict";

    // ---- DATA (baked in — no JSON files) ----
    const DATA = {"mods":{"steelhold":{"slug":"steelhold","kicker":"Minecraft Mod","emojiName":"🔐 Steelhold","title":"Steelhold • Mayflower Studios","tagline":"Heavy-duty safes for Forge survival — player ownership, bindable keys, in-place upgrades, and “anvil-style”\nfalling behavior for secure builds and long-running worlds.","cta":[{"label":"📦 Download","href":"https://www.curseforge.com/minecraft/mc-mods/steelhold","class":"btn primary"},{"label":"🧾 Changelog","href":"?mod=steelhold&view=changelog","class":"btn ghost"},{"label":"⬅ Back to Projects","href":"/projects.html","class":"btn ghost"}],"heroTiles":[{"title":"🔑 Bindable Keys","body":"Craft keys, then bind them to a safe/door you own."},{"title":"🧱 Tiered Safes","body":"Basic → Reinforced → Steelhold → Vault → Bank."},{"title":"🧰 Upgrade Kits","body":"Right-click upgrade a safe in-place (keeps data + inventory)."},{"title":"🚪 Steelhold Door","body":"A locked iron door with alarms + optional redstone rules."}],"descriptionHtml":["<p class=\"desc\"><strong>Steelhold</strong> is a Forge mod that adds player-owned safes with a practical lock-and-key workflow. When a safe (or Steelhold Door) is placed, it stores an <strong>Owner</strong> and a unique <strong>Lock ID</strong>. The owner can open it freely; everyone else needs a matching key.</p>","<p class=\"desc\">Steelhold is built for survival pacing and server longevity: safes can be tuned via config, support multiple tiers, and behave like real heavy objects — if you remove the block underneath, they <strong>fall like anvils</strong>.</p>","<div class=\"divider\" style=\"margin:14px 0;\"></div>","<h3 style=\"margin:0 0 6px;\">🔑 Keys (Craft → Bind → Share)</h3>","<p class=\"muted small\" style=\"margin:0 0 10px;\">Keys are crafted as blanks, then <strong>bound by right-clicking</strong> a safe/door you own.</p>","<p class=\"desc\" style=\"margin-top:0;\">Once bound, keys store the Lock ID in NBT and can open any Steelhold block that shares that lock (safes + doors). Tooltips show a short lock ID and extra context so you can manage multiple keys without losing track.</p>","<h3 style=\"margin:14px 0 6px;\">🧰 Upgrade Kits (In-Place Upgrades)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Upgrade kits let you <strong>right-click a safe</strong> to upgrade it to the next tier without picking it up. The upgrade preserves the important stuff: <strong>inventory</strong>, <strong>custom name</strong>, <strong>owner</strong>, and <strong>Lock ID</strong>.</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li>Reinforced Upgrade Kit: Basic → Reinforced</li><li>Steelhold Upgrade Kit: Reinforced → Steelhold</li><li>Vault Upgrade Kit: Steelhold → Vault (2-block tall)</li><li>Bank Upgrade Kit: Vault → Bank (2×2×2 structure)</li></ul>","<div class=\"callout\" style=\"margin-top:12px;\"><strong>Space checks included</strong><p class=\"muted small\" style=\"margin:6px 0 0;\">Upgrades that expand into multi-block safes verify space first, so you don’t accidentally overwrite blocks.</p></div>","<h3 style=\"margin:14px 0 6px;\">🚪 Steelhold Door (Locked + Alarm + Redstone)</h3>","<p class=\"desc\" style=\"margin-top:0;\">The Steelhold Door is a locked iron door that uses the same ownership + key system as safes. If a non-owner tries to open it, it can trigger an <strong>alarm state</strong> and emit a strong redstone signal.</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li><strong>Alarm output:</strong> emits redstone while alarm is active (great for sirens, lights, or alerts).</li><li><strong>Optional redstone open:</strong> config can allow or deny opening via button/lever.</li><li><strong>Tool requirement:</strong> configurable pickaxe level gate for proper drops/breaking behavior.</li></ul>","<h3 style=\"margin:14px 0 6px;\">⬇️ Falling Safes (Anvil-Style Physics)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Safes are heavy: if the block under them disappears, they convert into a falling block entity (like anvils) and keep their stored data while falling/landing — including inventory, owner, and lock ID.</p>","<h3 style=\"margin:14px 0 6px;\">🏗️ Sizes &amp; Structure</h3>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li><strong>Basic / Reinforced / Steelhold</strong>: single-block safes.</li><li><strong>Vault Safe</strong>: a <strong>2-block-tall</strong> safe placed as a lower + upper half.</li><li><strong>Bank Safe</strong>: a <strong>2×2×2 “mega safe”</strong> (8 blocks). Only the origin block stores the inventory and drives the structure.</li></ul>","<h3 style=\"margin:14px 0 6px;\">⚙️ Configurable Balance</h3>","<p class=\"desc\" style=\"margin-top:0;\">Steelhold ships with a Forge <strong>common config</strong> that lets pack makers and servers tune: <strong>slot counts</strong>, <strong>hardness</strong>, <strong>blast resistance</strong>, and <strong>required pickaxe tier</strong> per safe tier. There are also global toggles for whether safes <strong>drop contents on break</strong> and whether <strong>explosions can destroy Steelhold blocks</strong>.</p>","<div class=\"callout\" style=\"margin-top:12px;\"><strong>Note: slot counts won’t shrink existing safes</strong><p class=\"muted small\" style=\"margin:6px 0 0;\">Slot settings apply to newly placed safes only. Existing safes keep their original size to prevent item loss.</p></div>"],"features":[{"title":"🔐 Ownership + Locks","badge":"Core","desc":"A simple, explicit ownership + lock ID approach that works well in survival and multiplayer.","bullets":["Owner can always open","Non-owners require a matching key","Same key can work for safes + doors (shared Lock ID)"]},{"title":"🔑 Craft + Bind Keys","badge":"New","desc":"Craft blank keys and bind them by right-clicking a Steelhold block you own.","bullets":["Bind to safes or Steelhold Doors","Share keys with trusted players","Tooltips help track what key goes to what"]},{"title":"🧰 Upgrade Kits","badge":"Add-on","desc":"Upgrade safe tiers in-place while preserving inventory + lock data.","bullets":["Right-click upgrade flow","Preserves owner, lock ID, name, and contents","Space checks for multi-block upgrades"]},{"title":"🚨 Alarm + Redstone","badge":"Add-on","desc":"Steelhold Door can alarm on intrusion and output redstone while active.","bullets":["Perfect for sirens, warning lamps, or alerts","Optional redstone-opening behavior via config","Tool requirement to prevent cheesy breaks"]},{"title":"⬇️ Physical Behavior","badge":"World","desc":"Safes fall like anvils and keep their data when they land.","bullets":["Inventory, owner, and lock ID persist through falling","Vault Safe handles both halves cleanly","Bank Safe keeps the structure consistent"]},{"title":"⚙️ Server Tuning","badge":"Config","desc":"Balance the grind, security, and progression to match your pack or server rules.","bullets":["Slots / hardness / blast resistance per tier","Required tool level per tier","Explosion + drop-contents toggles"]}],"howTo":[{"title":"1) Craft & Place","desc":"Place a safe (or Steelhold Door) like any block — it binds to the player who placed it.","bullets":["Owner is stored on the block","Each gets a unique Lock ID","Vault is 2-block tall; Bank is a 2×2×2 structure"]},{"title":"2) Craft Keys, Then Bind (Owner)","desc":"Make blank keys, then right-click the safe/door you own to bind.","bullets":["Craft: Steelhold Key","Right-click your safe/door to bind","Share bound keys with trusted players"]},{"title":"3) Upgrade In-Place (Optional)","desc":"Use upgrade kits to step safes up without moving items around.","bullets":["Right-click a safe with the correct kit","Preserves inventory + lock data","Expanding tiers check for space"]},{"title":"4) Alarms & Automation (Door)","desc":"Use the door alarm redstone output to wire up a security system.","bullets":["Intrusion attempts can trigger alarm mode","Alarm emits redstone while active","Config can allow/deny redstone opening"]}],"commandsIntro":"Steelhold includes a small set of server commands for management and testing (you must be looking at the safe/door within 5 blocks).","commandsCode":"/steelhold resetlock     → owner-only: resets the Lock ID (old keys stop working)\n/steelhold whoowns       → shows current owner (safe or door)\n/steelhold setowner <player> → admin/tooling: set the owner (safe or door)\n/steelhold fakeintrusion → triggers the alarm (safe/bank/vault/door) for testing","commandsCalloutTitle":"Resetting a lock invalidates old keys","commandsCalloutBody":"Use <code>/steelhold resetlock</code> if a key gets stolen or you’re rotating access rules on a server.","recipes":[{"title":"🔓 Basic Safe","desc":"Starter-tier safe crafted from iron and a wooden chest.","code":"Recipe:\n[Iron Ingot] [Iron Ingot] [Iron Ingot]\n[Iron Ingot] [Wood Chest] [Iron Ingot]\n[Iron Ingot] [Iron Ingot] [Iron Ingot]"},{"title":"🛠️ Reinforced Safe","desc":"Upgrade-tier safe using iron blocks, obsidian, and a Basic Safe.","code":"Recipe:\n[Obsidian]   [Iron Block]   [Obsidian]\n[Iron Block] [Basic Safe]   [Iron Block]\n[Obsidian]   [Iron Block]   [Obsidian]"},{"title":"⚙️ Steelhold Safe","desc":"Higher security tier using gold blocks, obsidian, and a Reinforced Safe.","code":"Recipe:\n[Obsidian]   [Gold Block]       [Obsidian]\n[Gold Block] [Reinforced Safe]  [Gold Block]\n[Obsidian]   [Gold Block]       [Obsidian]"},{"title":"🧱 Vault Safe (2-block tall)","desc":"Large safe tier crafted with diamond blocks, obsidian, and a Steelhold Safe.","code":"Recipe:\n[Obsidian]      [Diamond Block]   [Obsidian]\n[Diamond Block] [Steelhold Safe]  [Diamond Block]\n[Obsidian]      [Diamond Block]   [Obsidian]"},{"title":"🏦 Bank Safe (2×2×2 mega safe)","desc":"Endgame safe built from emerald blocks, obsidian, ender chests, and the Vault Safe.","code":"Recipe:\n[Emerald Block] [Obsidian]    [Emerald Block]\n[Obsidian]      [Ender Chest] [Obsidian]\n[Emerald Block] [Vault Safe]  [Emerald Block]"},{"title":"🔑 Steelhold Key","desc":"Craft blank keys, then bind by right-clicking your safe/door.","code":"Recipe:\n[   ]        [Iron Ingot]   [   ]\n[   ]        [Iron Nugget]  [   ]\n[   ]        [Iron Nugget]  [   ]\n\nBind:\nRight-click a Steelhold safe/door you own"},{"title":"🚪 Steelhold Door","desc":"A locked iron door crafted by combining an iron door with a Basic Safe.","code":"Recipe (Shapeless):\n[Basic Safe] + [Iron Door] → [Steelhold Door]"},{"title":"🧰 Reinforced Upgrade Kit","desc":"Upgrade: Basic → Reinforced (right-click on a Basic Safe).","code":"Recipe:\n[Obsidian]   [Iron Block]      [Obsidian]\n[Iron Block] [Redstone Block]  [Iron Block]\n[Obsidian]   [Iron Block]      [Obsidian]"},{"title":"🧰 Steelhold Upgrade Kit","desc":"Upgrade: Reinforced → Steelhold (right-click on a Reinforced Safe).","code":"Recipe:\n[Obsidian]  [Gold Block]      [Obsidian]\n[Gold Block][Redstone Block]  [Gold Block]\n[Obsidian]  [Gold Block]      [Obsidian]"},{"title":"🧰 Vault Upgrade Kit","desc":"Upgrade: Steelhold → Vault (right-click on a Steelhold Safe).","code":"Recipe:\n[Obsidian]      [Diamond Block]   [Obsidian]\n[Diamond Block] [Redstone Block]  [Diamond Block]\n[Obsidian]      [Diamond Block]   [Obsidian]"},{"title":"🧰 Bank Upgrade Kit","desc":"Upgrade: Vault → Bank (right-click on a Vault Safe).","code":"Recipe:\n[Emerald Block] [Obsidian]       [Emerald Block]\n[Obsidian]      [Ender Chest]    [Obsidian]\n[Emerald Block] [Redstone Block] [Emerald Block]"}],"media":{"icon":"/assets/icons/steelhold.png","name":"Steelhold","subtitle":"Safes, keys, doors, and upgrade progression","shots":[{"src":"/assets/shots/steelhold-1.png","alt":"Steelhold screenshot 1","cap":"Single-block tiers — compact and survival-friendly."}]},"install":{"calloutTitle":"Recommended setup","calloutBody":"Keep client + server mod versions in sync. Pin versions for packs and servers.","stepsCode":"1) Install Forge (matching your mod version)\n2) Drop Steelhold into /mods\n3) Launch once to generate config\n4) Restart after config changes","buttons":[{"label":"📦 CurseForge","href":"https://www.curseforge.com/minecraft/mc-mods/steelhold","class":"button mods"},{"label":"🧾 Changelog","href":"?mod=steelhold&view=changelog","class":"button ghost"}]}},"logichest":{"slug":"logichest","kicker":"Minecraft Mod (Forge)","emojiName":"🧠 LogiChest","title":"LogiChest • Mayflower Studios","tagline":"Hub-and-sorter storage routing with clean rules, survival-friendly pacing, and upgrade-based scaling —\nincluding optional autocrafting, autosmelting, and multi-hub authorization.","cta":[{"label":"📦 Download","href":"https://www.curseforge.com/minecraft/mc-mods/logichest","class":"btn primary"},{"label":"🧾 Changelog","href":"?mod=logichest&view=changelog","class":"btn ghost"},{"label":"⬅ Back to Projects","href":"/projects.html","class":"btn ghost"}],"heroTiles":[{"title":"🏠 Hub Routing","body":"Pulls from the container the Hub is facing and routes into sorter destinations."},{"title":"🧩 Sorter Filters","body":"10-slot whitelist (ghost filters) routes by item type (simple & predictable)."},{"title":"🛠️ Autocraft + Autosmelt","body":"Optional upgrades craft or smelt directly from the Hub into a sorter’s output."},{"title":"🔑 Keychains","body":"Keychain Module adds a 9-slot key ring so one sorter can authorize multiple hubs."}],"descriptionHtml":["<p class=\"desc\"><strong>LogiChest</strong> is a lightweight Forge mod that adds a clean logistics layer to survival storage. You build a <strong>Hub</strong> to act as the router, then attach <strong>Sorters</strong> that decide what items should be routed and where they should be delivered.</p>","<p class=\"desc\">The goal: keep automation <strong>readable</strong>, <strong>predictable</strong>, and <strong>server-friendly</strong> — without turning your base into a spaghetti pipe network.</p>","<div class=\"divider\" style=\"margin:14px 0;\"></div>","<h3 style=\"margin:0 0 6px;\">🔗 How routing works (simple, real, reliable)</h3>","<p class=\"desc\" style=\"margin-top:0;\">The Hub pulls items from the inventory <strong>directly in front of it</strong> (the direction the Hub is facing). Each linked Sorter points at a <strong>destination inventory</strong> (the container in front of the Sorter). If an item in the Hub’s source matches a Sorter’s filters, the Hub moves it into that Sorter’s destination.</p>","<h3 style=\"margin:14px 0 6px;\">🗝️ LogiLink Keys (Hub-bound)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Link Keys are crafted <strong>inside the Hub</strong> over time and become bound to that specific Hub (<strong>ID + position + dimension</strong>). Put the key into a Sorter’s link slot to connect it. If the Hub is at max linked Sorters, the link is rejected.</p>","<div class=\"callout\" style=\"margin-top:12px;\"><strong>Hub key ingredients</strong><p class=\"muted small\" style=\"margin:6px 0 0;\">The Hub crafts a LogiLink Key using: <code>Iron Ingot</code> + <code>Redstone</code> + <code>Amethyst Shard</code> (craft time is configurable).</p></div>","<h3 style=\"margin:14px 0 6px;\">📦 Filter whitelist (10 slots)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Each Sorter has <strong>10 ghost filter slots</strong>. Filters match by <strong>item type</strong> (NBT isn’t considered). Only items that match a Sorter’s filter list are eligible to be routed into it.</p>","<h3 style=\"margin:14px 0 6px;\">⚙️ Upgrades (4 slots, stackable where it matters)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Each Sorter has <strong>4 upgrade slots</strong>. Some upgrades can stack to scale performance and throughput.</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li><strong>Speed Coil</strong>: reduces routing/autotick cooldown (faster sorting and faster craft/smelt intervals). <em>Stacks (up to 8 per stack).</em></li><li><strong>Stack Booster</strong>: increases how many items move per batch (base 1 + boosters). <em>Stacks (up to 8 per stack).</em></li><li><strong>Autocrafter Core</strong>: enables crafting from Hub inventory directly into the sorter’s destination container.</li><li><strong>Autosmelter Core</strong>: enables smelting from Hub inventory into the sorter’s destination container (fuel is pulled from the Hub, furnace-style).</li><li><strong>Keychain Module</strong>: adds a built-in 9-slot keychain inventory so the sorter can authorize multiple hubs.</li></ul>","<h3 style=\"margin:14px 0 6px;\">🧷 Keychain Module (multi-hub authorization)</h3>","<p class=\"desc\" style=\"margin-top:0;\">Install the <strong>Keychain Module</strong> to give the sorter a hidden <strong>9-slot keychain</strong> inventory. Put multiple Hub-bound Link Keys into it and the sorter can register with multiple hubs (as long as each hub has capacity).</p>","<p class=\"muted small\" style=\"margin:6px 0 0;\">Bonus: the Keychain Module item itself can be right-clicked to open its own 9-slot GUI (handy for managing keys).</p>","<h3 style=\"margin:14px 0 6px;\">🔥 Autosmelting (fuel handled “like a furnace”)</h3>","<p class=\"desc\" style=\"margin-top:0;\">With <strong>Autosmelter Core</strong> installed, the sorter can smelt items using real fuel burn time rules. Fuel is pulled from the Hub inventory (and container items like buckets are returned when possible). Output goes to the sorter’s destination container.</p>","<h3 style=\"margin:14px 0 6px;\">🧊 Server-friendly defaults (configurable)</h3>","<p class=\"desc\" style=\"margin-top:0;\">LogiChest includes a Forge server config to tune pacing and limits. Defaults:</p>","<ul><li><strong>Max linked sorters per Hub:</strong> 8</li><li><strong>Hub transfer cooldown:</strong> 8 ticks (vanilla hopper speed)</li><li><strong>Transfers per cycle:</strong> 3</li><li><strong>LogiLink Key craft time:</strong> 600 ticks (30 seconds)</li></ul>","<div class=\"callout\" style=\"margin-top:12px;\"><strong>Best used for</strong><p class=\"muted small\" style=\"margin:6px 0 0;\">Storage rooms, farm outputs, smelter buffers, and “loot intake” systems where you want clean routing without complexity.</p></div>"],"features":[{"title":"📦 Hub → Sorter Routing","badge":"Core","desc":"The Hub routes items from its facing inventory to sorter destinations based on sorter whitelist filters.","bullets":["Round-robin fairness across linked sorters","Routes only items that match a sorter’s filters","Stable, “rules-first” automation (no surprises)"]},{"title":"⚙️ Upgrade-driven Scaling","badge":"Polish","desc":"Sorters scale with upgrades: faster cycles, bigger batches, plus optional craft/smelt automation.","bullets":["Speed Coils: faster routing + faster auto intervals","Stack Boosters: higher throughput per matched item type","Autocrafter Core + Autosmelter Core: craft/smelt from Hub into output","Keychain Module: authorize one sorter for multiple hubs"]}],"howTo":[{"title":"1) Decide your “source” inventory","desc":"The Hub pulls from the container it is facing.","bullets":["Example sources: farm output chest, buffer chest, drop-off chest","Place the Hub so it faces that container","That facing container becomes the Hub’s input source"]},{"title":"2) Place Sorters at destinations","desc":"Each sorter points at the container it should fill.","bullets":["Put a Sorter beside a destination chest/barrel","Make the Sorter face the destination container","That facing container becomes the sorter’s output destination"]},{"title":"3) Craft a LogiLink Key in the Hub","desc":"The Hub crafts keys over time using 3 ingredients.","bullets":["Put Iron Ingot, Redstone, Amethyst Shard into the Hub inputs","Wait for the progress to finish (default: 30s)","The key is bound to that Hub (ID + pos + dimension)"]},{"title":"4) Link Sorters & set filters","desc":"Link keys connect a sorter to a hub, filters decide what it accepts.","bullets":["Put the LogiLink Key into the sorter’s link slot","Set the sorter’s 10 filter slots (ghost items)","The Hub will route matching items into that sorter’s destination"]},{"title":"5) Add upgrades (optional)","desc":"Scale routing, enable crafting, or enable smelting.","bullets":["Speed Coils: faster cycles","Stack Boosters: bigger batches","Autocrafter/Autosmelter: craft or smelt from Hub inventory into output"]},{"title":"6) Multi-hub sorters (Keychain Module)","desc":"Authorize one sorter for multiple hubs by storing multiple keys.","bullets":["Install Keychain Module in the sorter upgrade slots","Open it and insert multiple LogiLink Keys","Sorter registers with each hub (if each hub has space)"]}],"commandsIntro":"","commandsCode":"","commandsCalloutTitle":"","commandsCalloutBody":"","recipes":[{"title":"🏠 Hub Block","desc":"The central router. Pulls from the inventory it faces.","code":"Recipe:\n[ ]      [Hopper]   [ ]\n[Hopper] [Wood Chest] [Hopper]\n[ ]      [Hopper]   [ ]","note":"Uses <code>forge:chests/wooden</code> (any wooden chest)."},{"title":"🧩 Sorter","desc":"Whitelist filter + destination delivery. Faces the output container it fills.","code":"Recipe:\n[ ]        [Hopper]      [ ]\n[Redstone] [Comparator]  [Redstone]\n[ ]        [Hopper]      [ ]"},{"title":"🛠️ Autocrafter Core","desc":"Upgrade. Enables crafting from Hub inventory into the sorter destination.","code":"Recipe:\n[Iron]    [Redstone]      [Iron]\n[Redstone][Crafting Table][Redstone]\n[Iron]    [Redstone]      [Iron]"},{"title":"🔥 Autosmelter Core","desc":"Upgrade. Enables smelting from Hub inventory into the sorter destination (fuel from the Hub).","code":"Recipe:\n[Iron]    [Redstone]  [Iron]\n[Redstone][Furnace]   [Redstone]\n[Iron]    [Redstone]  [Iron]"},{"title":"⏩ Speed Coil","desc":"Upgrade. More coils = faster sorter cooldown (and faster craft/smelt interval). Stacks up to 8 per stack.","code":"Recipe:\n[Gold]    [Redstone]  [Gold]\n[Redstone][Piston]    [Redstone]\n[Gold]    [Redstone]  [Gold]"},{"title":"➕ Stack Booster","desc":"Upgrade. Increases transfer batch amount (base 1 + boosters). Stacks up to 8 per stack.","code":"Recipe:\n[Iron]   [Hopper]    [Iron]\n[Hopper] [Wood Chest][Hopper]\n[Iron]   [Hopper]    [Iron]","note":"Uses <code>forge:chests/wooden</code> (any wooden chest)."},{"title":"🔑 Keychain Module","desc":"Upgrade. Adds an internal 9-slot keychain inventory to a sorter (authorize multiple hubs).","code":"Recipe:\n[Iron]   [String]  [Iron]\n[String] [Hopper]  [String]\n[Iron]   [String]  [Iron]"},{"title":"🗝️ LogiLink Key (crafted in the Hub)","desc":"Crafted over time inside the Hub (not a crafting-table recipe). Stores hub ID + position + dimension.","code":"Hub inputs:\n- Iron Ingot\n- Redstone\n- Amethyst Shard\n\nDefault craft time: 600 ticks (30s)"}],"media":{"icon":"/assets/icons/logichest.png","name":"LogiChest","subtitle":"Hub routing, sorter filters, and upgrade-driven automation","shots":[{"src":"/assets/shots/logichest-1.png","alt":"LogiChest screenshot 1","cap":"Hub crafting recipe."},{"src":"/assets/shots/logichest-2.png","alt":"LogiChest screenshot 2","cap":"Sorter crafting recipe."},{"src":"/assets/shots/logichest-3.png","alt":"LogiChest screenshot 3","cap":"Autocrafter Core crafting recipe."},{"src":"/assets/shots/logichest-4.png","alt":"LogiChest screenshot 4","cap":"Keychain Module crafting recipe."},{"src":"/assets/shots/logichest-5.png","alt":"LogiChest screenshot 5","cap":"Speed Coil crafting recipe."},{"src":"/assets/shots/logichest-6.png","alt":"LogiChest screenshot 6","cap":"Stack Booster crafting recipe."}]},"install":{"calloutTitle":"Recommended setup","calloutBody":"For servers: keep mod versions pinned and consistent across client + server.","stepsCode":"1) Install Forge for your Minecraft version\n2) Drop LogiChest into /mods (client + server)\n3) Launch once to generate the config\n4) Restart after any config changes","buttons":[{"label":"📦 CurseForge","href":"https://www.curseforge.com/minecraft/mc-mods/logichest","class":"button mods"},{"label":"🧾 Changelog","href":"?mod=logichest&view=changelog","class":"button ghost"}]}},"gentlecreeper":{"slug":"gentlecreeper","kicker":"Minecraft Mod","emojiName":"🧸 The Gentle Creeper","title":"The Gentle Creeper • Mayflower Studios","tagline":"A non-exploding creeper who just wanted a friend.","cta":[{"label":"📦 Download","href":"https://www.curseforge.com/minecraft/mc-mods/gentle-creeper","class":"btn primary"},{"label":"🧾 Changelog","href":"?mod=gentlecreeper&view=changelog","class":"btn ghost"},{"label":"⬅ Back to Projects","href":"/projects.html","class":"btn ghost"}],"heroTiles":[{"title":"👋 Just Wants to Say Hi","body":"A new creeper variant that walks up to players peacefully, curious and friendly instead of explosive."},{"title":"💥 No Explosions. Ever.","body":"Gentle Creepers look exactly like normal creepers — but they will never explode."},{"title":"🌿 Familiar, Not Fearful","body":"Same iconic creeper look. Completely different behavior. No jump scares, no griefing."},{"title":"🧩 Simple & Vanilla-Friendly","body":"Adds one new mob with clean behavior changes that feel right at home in Minecraft."}],"descriptionHtml":["<p><strong>The Gentle Creeper</strong> doesn’t replace or alter vanilla creepers — it introduces a brand-new creeper variant with a softer nature.</p> <p>Regular creepers remain just as dangerous as ever. This mod simply allows the world to occasionally spawn a gentler green friend alongside the usual chaos.</p> <p>Gentle Creepers look exactly like normal creepers, but they don’t explode. Instead, they quietly wander up to players just to say hello.</p> <p>Perfect for cozy playthroughs and friendly servers, this mod adds small, wholesome moments without removing Minecraft’s tension.</p> <p>Sometimes you get a jumpscare. Sometimes… you get a creeper that just stands there like, “hi.”</p>"],"features":[{"title":"🟢 A Familiar Face, A Kinder Soul","desc":"Gentle Creepers look identical to vanilla creepers, keeping the iconic green design intact. The difference is entirely in their behavior — they don’t hiss, don’t chase, and never explode. Instead, they calmly wander up to players as if they just want to say hello, creating quiet, wholesome moments where tension used to be."},{"title":"🌱 Wholesome Moments Without Losing Danger","desc":"This mod doesn’t remove Minecraft’s threat or challenge. Normal creepers still spawn and behave exactly as expected. Gentle Creepers simply appear alongside them, adding contrast — sometimes danger, sometimes kindness — making the world feel more alive, surprising, and emotionally varied without disrupting gameplay balance."}],"howTo":[],"recipes":[],"commandsIntro":"","commandsCode":"","commandsCalloutTitle":"","commandsCalloutBody":"","media":{"icon":"/assets/icons/gentlecreeper.png","name":"The Gentle Creeper","subtitle":"Minecraft Mod","shots":[]},"install":{"calloutTitle":"Recommended setup","calloutBody":"Keep client and server versions in sync for consistent behavior.","stepsCode":"1) Install Forge (matching your Minecraft version)\n2) Drop The Gentle Creeper into /mods\n3) Launch once to generate config\n4) Restart after config changes","buttons":[{"label":"📦 CurseForge","href":"https://www.curseforge.com/minecraft/mc-mods/gentle-creeper","class":"btn ghost"},{"label":"🧾 Changelog","href":"?mod=gentlecreeper&view=changelog","class":"btn ghost"}]}},"amumucurse":{"slug":"amumucurse","kicker":"Minecraft Mod","emojiName":"💔 Amumu Curse","title":"Amumu Curse • Mayflower Studios","tagline":"A quiet, sorrow-driven curse that seeps into the world around you — subtle decay, uneasy villagers, and a ritual-based path to cleansing.","cta":[{"label":"📦 Download","href":"https://www.curseforge.com/minecraft/mc-mods/amumu-curse","class":"btn primary"},{"label":"🧾 Changelog","href":"?mod=amumucurse&view=changelog","class":"btn ghost"},{"label":"⬅ Back to Projects","href":"/projects.html","class":"btn ghost"}],"heroTiles":[{"title":"💔 Sorrow System","body":"A creeping curse that grows quietly over time."},{"title":"🌒 World Decay","body":"Light falters and the environment reacts to your presence."},{"title":"👥 Uneasy Villagers","body":"Villagers sense the sorrow and recoil instead of fighting it."},{"title":"🕯️ Ritual Cleansing","body":"Cure the curse through a midnight ritual — alone or with help."}],"descriptionHtml":["<p class=\"desc\"><strong>Amumu Curse</strong> adds a slow-burning affliction inspired by sorrow itself. This is not a curse that harms you outright — it lingers, changes the mood of the world, and leaves subtle signs that something is wrong.</p>","<p class=\"desc\">There are no warnings, no timers, and no flashing indicators. The curse reveals itself through atmosphere, decay, and how others react to you.</p>","<div class=\"divider\" style=\"margin:14px 0;\"></div>","<h3 style=\"margin:0 0 6px;\">💔 The Curse & Sorrow</h3>","<p class=\"desc\" style=\"margin-top:0;\">Once afflicted, sorrow slowly builds over time. As it grows, the world begins to feel heavier in your presence. The curse does not announce itself — it simply becomes noticeable.</p>","<h3 style=\"margin:14px 0 6px;\">🌒 Environmental Decay</h3>","<p class=\"desc\" style=\"margin-top:0;\">Sorrow affects the environment around you:</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li>Torches, lanterns, and fires may flicker or dim</li><li>The area around you feels unstable and uneasy</li><li>Light itself seems to struggle as sorrow deepens</li></ul>","<h3 style=\"margin:14px 0 6px;\">👥 Villagers & Creatures</h3>","<p class=\"desc\" style=\"margin-top:0;\">Villagers do not take damage from the curse. Instead, they react to it.</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li>Villagers subtly step back from cursed players</li><li>Their behavior reflects discomfort, not fear</li></ul>","<p class=\"desc\" style=\"margin-top:8px;\">Other passive creatures are not as resilient. As sorrow grows, passive mobs near you begin to take damage, as if the land itself is slowly decaying.</p>","<h3 style=\"margin:14px 0 6px;\">🩹 Bandages</h3>","<p class=\"desc\" style=\"margin-top:0;\"><strong>Bandages</strong> offer temporary relief, slowing sorrow’s growth but never curing it. They are meant to help you endure — not escape.</p>","<p class=\"desc\"><strong>Golden Bandages</strong> are rarer and more powerful. They allow the curse to be cleansed without another player present, using the same ritual process.</p>","<h3 style=\"margin:14px 0 6px;\">🕯️ The Cleansing Ritual</h3>","<p class=\"desc\" style=\"margin-top:0;\">The curse cannot be removed casually. Cleansing requires a ritual performed under specific conditions:</p>","<ul class=\"muted small\" style=\"margin:0; padding-left:18px;\"><li>Crying Obsidian beneath the afflicted player</li><li>A three-block wooden altar (any wood type)</li><li>Candles placed at both ends of the altar</li><li>The ritual must occur around midnight</li></ul>","<p class=\"desc\" style=\"margin-top:8px;\">Normally, another player must be present to complete the ritual. Golden Bandages allow the ritual to succeed alone.</p>","<p class=\"desc\">If any part of the ritual is incorrect, nothing happens. The curse remains.</p>"],"features":[{"title":"💔 Sorrow-Based Curse","badge":"Core","desc":"A slow, atmospheric curse that builds quietly over time.","bullets":["No direct damage to the player","No UI spam or warnings","Designed to be felt, not fought"]},{"title":"🌒 Environmental Effects","badge":"World","desc":"The world subtly reacts to sorrow.","bullets":["Flickering or dimming light sources","Uneasy environmental atmosphere","Gradual, noticeable decay"]},{"title":"👥 Villager Reactions","badge":"Behavior","desc":"Villagers sense sorrow without being harmed by it.","bullets":["Villagers step back instead of attacking","Adds emotional weight without violence"]},{"title":"🩹 Bandages & Golden Bandages","badge":"Items","desc":"Temporary relief and alternate cleansing paths.","bullets":["Bandages suppress sorrow growth","Golden Bandages enable solo cleansing","Neither bypasses the ritual"]},{"title":"🕯️ Ritual Cleansing","badge":"Lore","desc":"A deliberate, timing-based cure rooted in ritual.","bullets":["Midnight-only cleansing","Structure-based ritual","Failure gives no feedback"]}],"howTo":[{"title":"1) Become Cursed","desc":"Once afflicted, sorrow begins to grow naturally over time.","bullets":["No immediate effects","Changes become noticeable gradually"]},{"title":"2) Endure or Suppress","desc":"Use bandages to slow sorrow if needed.","bullets":["Temporary relief only","Does not remove the curse"]},{"title":"3) Prepare the Ritual","desc":"Build the cleansing structure correctly.","bullets":["Crying Obsidian base","Three-block wooden altar","Candles on both ends"]},{"title":"4) Cleanse at Midnight","desc":"Perform the ritual at the correct time.","bullets":["Another player required, unless using Golden Bandages","Incorrect rituals silently fail"]}],"recipes":[{"title":"🩹 Tattered Bandages","desc":"Basic bandages used to suppress sorrow for a short time. Offers relief, but does not cure the curse.","code":"Recipe:\n[String]  [Paper]    [String]\n[]        [Charcoal] []\n[String]  [Paper]    [String]"},{"title":"✨ Golden Bandages","desc":"A rare, reinforced form of bandages that allows the cleansing ritual to be performed alone.","code":"Recipe:\n[Gold Ingot] [Gold Ingot] [Gold Ingot]\n[Ghast Tear] [Bandages]   [Ghast Tear]\n[Gold Ingot] [Gold Ingot] [Gold Ingot]","note":"Uses <code>amumucurse:bandages</code> as the center ingredient."}],"media":{"icon":"/assets/icons/amumucurse.png","name":"Amumu Curse","subtitle":"A sorrow-driven curse of atmosphere and decay","shots":[{"src":"/assets/shots/amumu-1.png","alt":"Amumu Curse screenshot 1","cap":"Tomb found in the desert. Watch out for the lingering curse."},{"src":"/assets/shots/amumu-2.png","alt":"Amumu Curse screenshot 2","cap":"Alter used to clear the curse."},{"src":"/assets/shots/amumu-3.png","alt":"Amumu Curse screenshot 3","cap":"Crafting recipe for the Tatered Bandage."},{"src":"/assets/shots/amumu-4.png","alt":"Amumu Curse screenshot 4","cap":"Crafting recipe for the Golden Bandages."}]},"install":{"calloutTitle":"Recommended setup","calloutBody":"Keep client and server versions in sync for consistent behavior.","stepsCode":"1) Install Forge (matching your Minecraft version)\n2) Drop Amumu Curse into /mods\n3) Launch once to generate config\n4) Restart after config changes","buttons":[{"label":"📦 CurseForge","href":"https://www.curseforge.com/minecraft/mc-mods/amumu-curse","class":"button mods"},{"label":"🧾 Changelog","href":"?mod=amumucurse&view=changelog","class":"button ghost"}]}}},"changelogs":{"steelhold":{"id":"steelhold","name":"Steelhold","emoji":"🔐","kicker":"Minecraft Mod","backHref":"?mod=steelhold","downloadHref":"https://www.curseforge.com/minecraft/mc-mods/steelhold","versions":[{"version":"1.2.1","date":"","badge":"Bug fixes and upgrade items","added":["Upgrade items to just right click a safe to upgrade it instead of needing to break them first to use in crafting."],"changed":["Doors can now be renamed like the safes."],"fixed":["Door issue with not dropping items. Doors now drop the item when broken."],"stability":[],"knownIssues":[],"note":"","other":[]},{"version":"1.2.0","date":"","badge":"DOORS!","added":["Added a door that locks just like the safes do.","The doors can also give off a redstone signal when used without the key just like the safes."],"changed":[],"fixed":[],"stability":[],"knownIssues":[]},{"version":"1.1.1","date":"","badge":"Bug fixes plus some changes","added":["Safes now emit a redstone signal when trying to open with the wrong key so you can set up an alarm/trap system for them."],"changed":["No longer uses a command to make a key. You craft unbound keys and right click your safe to bind it.","Crafting recipes have changed making them easier to make but still balanced."],"fixed":["Vault safe breaking texture for the top block is fixed."],"stability":[],"knownIssues":["There are some texture issues with the Vault safe that are being looked into ded":["Hub + sorter framework and basic linking."],"changed":[],"fixed":[],"stability":[],"knownIssues":[]}]},"amumucurse":{"id":"amumucurse","name":"Amumu Curse","emoji":"💔","kicker":"Minecraft Mod","backHref":"?mod=amumucurse","downloadHref":"https://www.curseforge.com/minecraft/mc-mods/amumucurse","versions":[{"version":"1.0.0","date":"","badge":"Initial Release","added":["Sorrow system that builds over time while cursed.","Environmental decay effects that intensify as sorrow rises.","Light sources (torches, lanterns, etc.) can flicker or dim when sorrow is high.","Villagers react to cursed players by stepping back instead of taking damage.","Passive mobs take damage over time near high-sorrow players.","Bandages that suppress sorrow growth (temporary relief, not a cure).","Golden Bandages that allow solo cleansing (ritual still required).","Cleansing ritual at midnight using Crying Obsidian + a wooden altar + candles."],"changed":[],"fixed":[],"stability":[],"knownIssues":[]},{"version":"1.0.0_1","date":"2026-02-05","badge":"Hotfix","added":[],"changed":[],"fixed":["Server crash issue"],"stability":[],"knownIssues":[]}]},"gentlecreeper":{"id":"gentlecreeper","name":"The Gentle Creeper","emoji":"🧸","kicker":"Minecraft Mod","backHref":"https://mayflowerstudios.net/projects.html","downloadHref":"https://www.curseforge.com/minecraft/mc-mods/gentle-creeper","versions":[{"version":"1.0.0","date":"2026-02-06","note":"Initial release","added":[],"changed":[],"fixed":[],"other":[]}]}}};
    const META = {"bots":[{"slug":"foxbot","emoji":"🦊","name":"FoxBot","kicker":"Discord Bot (Private)","tagline":"Kiko — a cozy fennec-fox AI helper for Luna's Magical Forest.","href":"/bots/foxbot.html","icon":"/assets/icons/foxbot.png"},{"slug":"echobloom","emoji":"🌸","name":"EchoBloom","kicker":"Discord RPG Bot","tagline":"A blooming text-RPG: classes, quests, world events, weather, and a bestiary.","href":"/bots/echobloom.html","icon":"/assets/icons/echobloom.png"},{"slug":"bloombot","emoji":"🌼","name":"BloomBot","kicker":"Discord Bot","tagline":"A gentle companion bot for cozy community spaces.","href":"/bots/bloombot.html","icon":null}],"modIndex":[{"slug":"steelhold","emojiName":"🔐 Steelhold","kicker":"Minecraft Mod","tagline":"Heavy-duty safes for Forge survival — player ownership, bindable keys, in-place upgrades, and “anvil-style” falling behavior for secure builds and long-running worlds.","icon":"/assets/icons/steelhold.png"},{"slug":"logichest","emojiName":"🧠 LogiChest","kicker":"Minecraft Mod (Forge)","tagline":"Hub-and-sorter storage routing with clean rules, survival-friendly pacing, and upgrade-based scaling — including optional autocrafting, autosmelting, and multi-hub authorization.","icon":"/assets/icons/logichest.png"},{"slug":"gentlecreeper","emojiName":"🧸 The Gentle Creeper","kicker":"Minecraft Mod","tagline":"A non-exploding creeper who just wanted a friend.","icon":"/assets/icons/gentlecreeper.png"},{"slug":"amumucurse","emojiName":"💔 Amumu Curse","kicker":"Minecraft Mod","tagline":"A quiet, sorrow-driven curse that seeps into the world around you — subtle decay, uneasy villagers, and a ritual-based path to cleansing.","icon":"/assets/icons/amumucurse.png"}]};

    // ---- tiny helpers ----
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const qp = (k) => new URLSearchParams(location.search).get(k);
    function tile(t, body) { return `<div class="tile"><h3>${esc(t)}</h3><p>${esc(body)}</p></div>`; }

    // ---- INDEX VIEW ----
    function renderIndex() {
      const mods = (META.modIndex || []).map(m => projCard("?mod=" + m.slug, m.icon, m.emojiName.replace(/^[^ ]+\s*/, m.icon ? "" : ""), m.emojiName, m.kicker, m.tagline)).join("");
      const bots = (META.bots || []).map(b => projCard(b.href, b.icon, b.emoji, (b.emoji ? b.emoji + " " : "") + b.name, b.kicker, b.tagline)).join("");
      root.innerHTML = `
        <section class="hero">
          <div>
            <p class="kicker">Mayflower Studios</p>
            <h1>🌿 Projects</h1>
            <p class="muted">Minecraft Forge mods and cozy Discord bots — everything we build, in one place.</p>
          </div>
        </section>

        <div class="sectionTitle"><h2>🧱 Minecraft Mods</h2><span>Forge 1.20.1</span></div>
        <section class="projGrid">${mods}</section>

        <div class="sectionTitle"><h2>🤖 Discord Bots</h2><span>Community helpers</span></div>
        <section class="projGrid">${bots}</section>
      `;
      document.title = "Projects • Mayflower Studios";
    }

    function projCard(href, icon, emoji, name, kicker, tagline) {
      const head = icon
        ? `<img class="pc-ic" src="${esc(icon)}" alt="" loading="lazy">`
        : `<span class="pc-emoji">${esc(emoji || "📦")}</span>`;
      return `<a class="projCard" href="${esc(href)}">
        <div class="pc-head">${head}<div><p class="pc-kicker">${esc(kicker)}</p><h3>${esc(name)}</h3></div></div>
        <p class="pc-tag">${esc(tagline)}</p>
      </a>`;
    }

    // ---- MOD DETAIL VIEW ----
    function renderMod(slug) {
      const m = DATA.mods[slug];
      if (!m) { renderIndex(); return; }
      document.title = m.title || (slug + " • Mayflower Studios");

      const ctas = (m.cta || []).map(c => `<a class="${esc(c.class || "btn")}" href="${esc(c.href)}">${esc(c.label)}</a>`).join("");
      const tiles = (m.heroTiles || []).map(t => tile(t.title, t.body)).join("");

      const features = (m.features || []).map(f => `
        <div class="card feature">
          <span class="badge">${esc(f.badge || "")}</span>
          <h3 style="margin:0;">${esc(f.title)}</h3>
          <p class="muted" style="margin:0;">${esc(f.desc || "")}</p>
          ${(f.bullets && f.bullets.length) ? `<ul class="muted small" style="margin:4px 0 0;padding-left:18px;">${f.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        </div>`).join("");

      const howto = (m.howTo || []).map(h => `
        <div class="card howto">
          <h3 style="margin:0;">${esc(h.title)}</h3>
          <p class="muted" style="margin:0;">${esc(h.desc || "")}</p>
          ${(h.bullets && h.bullets.length) ? `<ul class="muted small" style="margin:4px 0 0;padding-left:18px;">${h.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        </div>`).join("");

      const recipes = (m.recipes || []).map(r => `
        <div class="card recipe">
          <h3 style="margin:0;">${esc(r.title)}</h3>
          <p class="muted" style="margin:0 0 4px;">${esc(r.desc || "")}</p>
          <pre class="codebox-pre">${esc(r.code || "")}</pre>
        </div>`).join("");

      const commands = m.commandsCode ? `
        <div class="sectionTitle"><h2>⌨️ Commands</h2><span>Admin + utilities</span></div>
        <section class="card">
          ${m.commandsIntro ? `<p class="muted">${esc(m.commandsIntro)}</p>` : ""}
          <pre class="codebox-pre">${esc(m.commandsCode)}</pre>
          ${m.commandsCalloutTitle ? `<div class="callout" style="margin-top:12px;"><strong>${esc(m.commandsCalloutTitle)}</strong><p class="muted small" style="margin:6px 0 0;">${m.commandsCalloutBody || ""}</p></div>` : ""}
        </section>` : "";

      const media = m.media || {};
      const shots = (media.shots || []).map(s => `<figure><img src="${esc(s.src)}" alt="${esc(s.alt || "")}" loading="lazy"><figcaption>${esc(s.cap || "")}</figcaption></figure>`).join("");
      const mediaBlock = `
        <div class="sectionTitle"><h2>🖼️ Media</h2><span>Icon &amp; screenshots</span></div>
        <section class="card">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:${shots ? "12px" : "0"};">
            ${media.icon ? `<img src="${esc(media.icon)}" alt="" style="width:48px;height:48px;border-radius:10px;">` : ""}
            <div><strong>${esc(media.name || m.slug)}</strong><br><span class="muted small">${esc(media.subtitle || "")}</span></div>
          </div>
          ${shots ? `<div class="shotGrid">${shots}</div>` : ""}
        </section>`;

      const inst = m.install || {};
      const instBtns = (inst.buttons || []).map(b => `<a class="${esc(b.class || "btn")}" href="${esc(b.href)}">${esc(b.label)}</a>`).join("");
      const installBlock = `
        <div class="sectionTitle"><h2>📥 Install</h2><span>Quick notes</span></div>
        <section class="card">
          ${inst.calloutTitle ? `<div class="callout"><strong>${esc(inst.calloutTitle)}</strong><p class="muted small" style="margin:6px 0 0;">${esc(inst.calloutBody || "")}</p></div>` : ""}
          ${inst.stepsCode ? `<pre class="codebox-pre" style="margin-top:12px;">${esc(inst.stepsCode)}</pre>` : ""}
          ${instBtns ? `<div class="ctaRow" style="margin-top:12px;">${instBtns}</div>` : ""}
        </section>`;

      const hasChangelog = !!DATA.changelogs[slug];
      root.innerHTML = `
        <a class="backLink" href="/projects.html">← All projects</a>
        <section class="hero">
          <div>
            <p class="kicker">${esc(m.kicker || "")}</p>
            <h1>${esc(m.emojiName || m.slug)}</h1>
            <p class="muted">${esc(m.tagline || "")}</p>
            <div class="ctaRow">${ctas}</div>
          </div>
          <div class="tileGrid">${tiles}</div>
        </section>

        <div class="subTabs">
          <a class="subTab on" href="?mod=${esc(slug)}">Overview</a>
          ${hasChangelog ? `<a class="subTab" href="?mod=${esc(slug)}&view=changelog">Changelog</a>` : ""}
        </div>

        <div class="sectionTitle"><h2>📝 Description</h2><span>What this mod is</span></div>
        <section class="card">${(m.descriptionHtml || []).join("")}</section>

        ${features ? `<div class="sectionTitle"><h2>⭐ Features</h2><span>What it focuses on</span></div><section class="grid2">${features}</section>` : ""}
        ${howto ? `<div class="sectionTitle"><h2>📘 How to Use</h2><span>Quick gameplay guide</span></div><section class="grid2">${howto}</section>` : ""}
        ${commands}
        ${recipes ? `<div class="sectionTitle"><h2>🧱 Crafting Recipes</h2><span>Recipes &amp; progression</span></div><section class="grid2">${recipes}</section>` : ""}
        ${mediaBlock}
        ${installBlock}
      `;
    }

    // ---- CHANGELOG VIEW ----
    function renderChangelog(slug) {
      const c = DATA.changelogs[slug];
      const m = DATA.mods[slug];
      if (!c) { renderMod(slug); return; }
      document.title = (m ? (m.media && m.media.name) || slug : slug) + " Changelog • Mayflower Studios";

      const groups = [
        ["added", "Added"], ["changed", "Changed"], ["fixed", "Fixed"],
        ["stability", "Stability"], ["knownIssues", "Known issues"], ["other", "Other"]
      ];
      const versions = (c.versions || []).map(v => {
        const body = groups.map(([k, label]) => {
          const items = v[k] || [];
          if (!items.length) return "";
          return `<div class="clGroup"><p class="cl-label">${label}</p><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
        }).join("");
        return `<div class="clVersion">
          <h3>v${esc(v.version)} ${v.badge ? `<span class="cl-badge">${esc(v.badge)}</span>` : ""} ${v.date ? `<span class="cl-date">${esc(v.date)}</span>` : ""}</h3>
          ${v.note ? `<p class="muted small">${esc(v.note)}</p>` : ""}
          ${body || `<p class="muted small">No notes for this version.</p>`}
        </div>`;
      }).join("");

      root.innerHTML = `
        <a class="backLink" href="?mod=${esc(slug)}">← Back to ${esc((m && m.media && m.media.name) || slug)}</a>
        <section class="hero">
          <div>
            <p class="kicker">${esc(c.kicker || "Changelog")}</p>
            <h1>${esc(c.emoji || "")} ${esc(c.name || slug)} — Changelog</h1>
            <p class="muted">Version history and release notes.</p>
            <div class="ctaRow">
              <a class="btn ghost" href="?mod=${esc(slug)}">← Overview</a>
              ${c.downloadHref ? `<a class="btn primary" href="${esc(c.downloadHref)}">📦 Download</a>` : ""}
            </div>
          </div>
        </section>
        <div class="subTabs">
          <a class="subTab" href="?mod=${esc(slug)}">Overview</a>
          <a class="subTab on" href="?mod=${esc(slug)}&view=changelog">Changelog</a>
        </div>
        <section class="card">${versions || `<p class="muted">No changelog yet.</p>`}</section>
      `;
    }

    // ---- ROUTER ----
    function route() {
      const mod = qp("mod");
      const view = qp("view");
      if (mod && DATA.mods[mod]) {
        if (view === "changelog") renderChangelog(mod);
        else renderMod(mod);
      } else {
        renderIndex();
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener("popstate", route);
    // intercept internal ?mod / ?view links for snappy client-side nav
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (!a) return;
      const href = a.getAttribute("href") || "";
      if (href.startsWith("?")) {
        e.preventDefault();
        history.pushState(null, "", href);
        route();
      }
    });

    route();
  })();
  </script>
</body>
</html>
