<!-- watch.html — legacy Watch Together lobby. Folded into the unified
     Together hub (together.html). This redirects so old links keep working. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Together — Mayflower Studios</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2" />
  <meta name="robots" content="noindex" />
  <script>
    // The lobby is now part of the Together hub. Forward any deep links:
    //  - ?join=<name> / ?missing=<name>: a password-protected or removed legacy
    //    room — send straight to the room page, which runs the legacy gate.
    //  - otherwise, land on the hub.
    (function () {
      var p = new URLSearchParams(location.search);
      var legacy = p.get("join") || p.get("missing");
      if (legacy) {
        location.replace("/watch-together.html?room=" + encodeURIComponent(legacy));
      } else {
        location.replace("/together.html");
      }
    })();
  </script>
</head>
<body>
  <noscript><a href="/together.html">Go to Together →</a></noscript>
  <p style="font-family:system-ui;opacity:.7;padding:40px;text-align:center;">
    Taking you to <a href="/together.html">Together</a>…
  </p>
</body>
</html>
