<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sign in to Mayflower Remote</title>
  <style>
    :root{color-scheme:dark;--bg:#10162a;--panel:#18213a;--line:#33405f;--text:#eef3ff;--muted:#aebbd6;--accent:#ff8fbe}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#202b4a 0,#10162a 52%);font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--text)}
    .card{width:min(520px,100%);padding:34px;border:1px solid var(--line);border-radius:20px;background:rgba(24,33,58,.96);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
    .flower{font-size:42px;margin-bottom:8px}.sub,.status{color:var(--muted)}button{width:100%;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#271329;margin-top:18px}button:disabled{opacity:.6;cursor:wait}.tiny{font-size:12px;color:var(--muted);margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="flower">🌸</div>
    <h1>Sign in to Mayflower Remote</h1>
    <p class="sub">Use the same Google account you use on mayflowerstudios.net.</p>
    <button id="google">Continue with Google</button>
    <p class="status" id="status">The signed-in session will be returned only to Mayflower Remote running on this PC.</p>
    <p class="tiny">You may close this tab after the app confirms the sign-in.</p>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, setPersistence, browserSessionPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const cfg = {
  apiKey: "AIzaSyDVJ0Tiq0gimaB-epcD9HQlVBrOWHq-IXI",
  authDomain: "watchtogether-95d7d.firebaseapp.com",
  databaseURL: "https://watchtogether-95d7d-default-rtdb.firebaseio.com",
  projectId: "watchtogether-95d7d",
  storageBucket: "watchtogether-95d7d.firebasestorage.app"
};
const params = new URLSearchParams(location.search);
const port = Number(params.get("port"));
const state = params.get("state") || "";
const status = document.getElementById("status");
const button = document.getElementById("google");
const valid = Number.isInteger(port) && port >= 1024 && port <= 65535 && /^[a-f0-9]{64}$/.test(state);

if (!valid) {
  button.disabled = true;
  status.textContent = "This sign-in link is invalid. Open Google sign-in again from Mayflower Remote.";
}

const app = initializeApp(cfg);
const auth = getAuth(app);
try { await setPersistence(auth, browserSessionPersistence); } catch (_) {}

button.addEventListener("click", async () => {
  if (!valid) return;
  button.disabled = true;
  status.textContent = "Opening Google…";
  try {
    const result = await signInWithPopup(auth, new GoogleAuthProvider());
    const user = result.user;
    const idToken = await user.getIdToken(true);
    if (!user.refreshToken) throw new Error("Firebase did not return a refresh session.");
    const payload = new URLSearchParams({
      state,
      uid: user.uid,
      email: user.email || "",
      idToken,
      refreshToken: user.refreshToken,
      expiresIn: "3600"
    });
    status.textContent = "Returning to Mayflower Remote…";
    location.replace(`http://127.0.0.1:${port}/callback#${payload.toString()}`);
  } catch (err) {
    const code = err && err.code || "";
    status.textContent = ({
      "auth/popup-blocked":"Your browser blocked the Google window. Allow popups and try again.",
      "auth/popup-closed-by-user":"The Google sign-in window was closed.",
      "auth/network-request-failed":"A network error interrupted sign-in."
    })[code] || (err && err.message) || "Google sign-in failed.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
