name: Med Reminders

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and send reminders
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          SMS_NUMBER: ${{ secrets.SMS_NUMBER }}
          SMS_CARRIER: ${{ secrets.SMS_CARRIER }}
          MG_ENCRYPTION_PASSPHRASE: ${{ secrets.MG_ENCRYPTION_PASSPHRASE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Timezone offset from UTC in hours (e.g., -5 for EST, -4 for EDT)
          TZ_OFFSET: ${{ secrets.TZ_OFFSET }}
        run: node .github/workflows/send-reminders.js
