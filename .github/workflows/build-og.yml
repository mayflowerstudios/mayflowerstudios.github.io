name: Build OG images

on:
  push:
    paths:
      - "*.html"
      - "tools/build-og.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          npm init -y
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Generate OG images + inject meta tags
        run: node tools/build-og.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og/*.png
          git add *.html
          git diff --cached --quiet || git commit -m "Auto-generate OG preview cards"
          git push
