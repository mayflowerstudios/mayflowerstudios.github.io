name: Build projects index

on:
  push:
    paths:
      - "data/mods/*.json"
      - "bots/*.html"
      - "projects.html"
      - "tools/build-projects.mjs"
      - "tools/projects-page.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data/projects.json
        run: node tools/build-projects.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/projects.json
          git diff --cached --quiet || git commit -m "Auto-build projects index"
          git push
