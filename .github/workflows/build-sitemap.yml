name: Build sitemap

on:
  push:
    paths:
      - "**/*.html"
      - "tools/build-sitemap.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build sitemap.xml
        run: node tools/build-sitemap.mjs
        env:
          SITE: https://mayflowerstudios.net

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-build sitemap"
          git push
