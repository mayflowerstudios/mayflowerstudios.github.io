<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gentle Creeper • Mayflower Studios</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- OG:START -->
  <!-- OG:END -->
</head>
<body data-nav="mods" data-mod-json="/data/mods/gentlecreeper.json">
  <div class="wrap">
    <div id="shared-nav"></div>

    <section class="hero">
      <div>
        <p class="kicker" id="modKicker"></p>
        <h1 id="modName"></h1>
        <p class="muted" id="modTagline"></p>
        <div class="ctaRow" id="modCtas"></div>
      </div>

      <div class="tileGrid" id="heroTiles"></div>
    </section>

    <section class="card">
      <h2>About</h2>
      <div id="descriptionBlock"></div>
    </section>

    <div class="sectionTitle">
      <h2>Highlights</h2>
      <span class="muted">What it adds</span>
    </div>
    <section class="grid3" id="featuresGrid"></section>

    <div class="sectionTitle">
      <h2>Recipes</h2>
      <span class="muted">Crafting</span>
    </div>
    <section class="grid3" id="recipesGrid"></section>

    <div class="sectionTitle">
      <h2>Media</h2>
      <span class="muted">Screenshots</span>
    </div>
    <section class="card" id="mediaBlock"></section>

    <div class="sectionTitle">
      <h2>Install</h2>
      <span class="muted">Quick steps</span>
    </div>
    <section class="card" id="installBlock"></section>

    <div id="shared-footer"></div>
  </div>

  <script src="/shared.js"></script>
  <script src="/tools/mods-page.js"></script>
</body>
</html>
